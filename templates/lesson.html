<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ lesson['title'] }} — Swedish Vocab Trainer</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
    <a class="back-link" href="/">&larr; All lessons</a>
    <header class="top">
        <div>
            <h1>{{ lesson['number'] }}. {{ lesson['title'] }}</h1>
            <div class="subtitle" id="summary">Loading…</div>
        </div>
        {% if lesson['best_score'] is not none %}
        <div class="best-score-block">
            <div class="best-score-label">Best score</div>
            <div class="score-badge large {{ score_class }}">{{ lesson['best_score'] }}%</div>
        </div>
        {% endif %}
    </header>

    <div class="actions-row spread">
        <div class="btn-group">
            <div id="quiz-actions" class="btn-group"></div>
            <a class="btn secondary" id="exercises-link" href="/exercises/{{ lesson['id'] }}">Exercises</a>
        </div>
        <div class="btn-group">
            <button id="edit-toggle-btn" class="icon-btn" title="Edit vocabulary" aria-label="Edit vocabulary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
            </button>
            <button id="reset-btn" class="icon-btn danger" title="Reset progress" aria-label="Reset progress">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path></svg>
            </button>
        </div>
    </div>

    <div class="filter-row">
        <button id="sort-toggle-btn" class="icon-btn" title="Sort by correct %" aria-label="Sort by correct %"></button>
        <label class="filter-check"><input type="checkbox" id="hide-known-cb"> Hide known</label>
    </div>

    <table class="words">
        <thead>
            <tr>
                <th>Word</th>
                <th>English</th>
                <th>Correct %</th>
                <th>Known</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="word-rows"></tbody>
    </table>
</div>

<script>
const lessonId = {{ lesson['id'] }};
const EDIT_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>`;
const SAVE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>`;
const MISTAKE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`;
const ARROW_UP_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>`;
const ARROW_DOWN_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>`;
const TRASH_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path></svg>`;

let allWords = [];
let editMode = false;
let sortDirection = localStorage.getItem('sortDirection') || 'asc'; // asc = worst (lowest correct%) first
let hideKnown = localStorage.getItem('hideKnown') === 'true';
let newRows = [];          // drafts added via "+ Add word", not yet saved
let pendingDeleteIds = [];  // word ids staged for deletion, sent on Save
let tempIdCounter = 0;

function mistakeIconHtml(w) {
    if (w.last_round_missed !== true) return '';
    return `<span class="mistake-icon" title="Missed at least once in your last quiz round">${MISTAKE_ICON}</span>`;
}

function correctPctClass(w) {
    if (w.wrong_pct === null) return 'none';
    const correctPct = 100 - w.wrong_pct;
    if (correctPct === 100) return 'perfect';
    if (correctPct <= 60) return 'low';
    return 'fair';
}

function correctPctText(w) {
    return w.wrong_pct === null ? '—' : (100 - w.wrong_pct) + '%';
}

function sortWords() {
    allWords.sort((a, b) => {
        // known words always sink to the bottom, regardless of sort direction
        if (a.known !== b.known) return a.known ? 1 : -1;
        // never-attempted words form their own fixed group: after tested
        // words, before known ones, in either sort direction
        const aTested = a.wrong_pct !== null;
        const bTested = b.wrong_pct !== null;
        if (aTested !== bTested) return aTested ? -1 : 1;
        if (!aTested) return 0;
        const aCorrect = 100 - a.wrong_pct;
        const bCorrect = 100 - b.wrong_pct;
        return sortDirection === 'asc' ? aCorrect - bCorrect : bCorrect - aCorrect;
    });
}

function visibleWords() {
    return allWords.filter(w => !(hideKnown && w.known));
}

function rerenderRows() {
    const tbody = document.getElementById('word-rows');
    tbody.innerHTML = '';
    visibleWords().forEach(w => tbody.appendChild(renderRow(w)));
}

function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s || '';
    return div.innerHTML;
}

function renderDisplayRow(tr, w) {
    tr.classList.remove('editing-row');
    if (w.known) tr.classList.add('known-row'); else tr.classList.remove('known-row');
    if (w.tense) tr.classList.add('verb-row');

    const tenseBadge = w.tense ? `<span class="tense-badge">${w.tense}</span>` : '';

    tr.innerHTML = `
        <td>${escapeHtml(w.swedish)}${tenseBadge}${mistakeIconHtml(w)}</td>
        <td>${escapeHtml(w.english)}</td>
        <td class="correct-pct ${correctPctClass(w)}">${correctPctText(w)}</td>
        <td><input type="checkbox" ${w.known ? 'checked' : ''}></td>
        <td></td>
    `;
    tr.querySelector('input').addEventListener('change', async (e) => {
        await fetch(`/api/words/${w.id}/known`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({known: e.target.checked})
        });
        w.known = e.target.checked;
        updateSummary();
        loadQuizActions();
        sortWords();
        rerenderRows();
    });
}

function renderEditableRow(tr, w) {
    tr.classList.add('editing-row');
    const tenseBadge = w.tense ? `<span class="tense-badge">${w.tense}</span>` : '';

    tr.innerHTML = `
        <td><input type="text" class="edit-input edit-swedish" value="${escapeHtml(w.swedish)}">${tenseBadge}${mistakeIconHtml(w)}</td>
        <td><input type="text" class="edit-input edit-english" value="${escapeHtml(w.english)}"></td>
        <td class="correct-pct ${correctPctClass(w)}">${correctPctText(w)}</td>
        <td><input type="checkbox" ${w.known ? 'checked' : ''}></td>
        <td><button class="icon-btn danger small" data-action="delete" title="Delete this word" aria-label="Delete this word">${TRASH_ICON}</button></td>
    `;
    tr.querySelector('input[type="checkbox"]').addEventListener('change', async (e) => {
        await fetch(`/api/words/${w.id}/known`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({known: e.target.checked})
        });
        w.known = e.target.checked;
        updateSummary();
        loadQuizActions();
    });
    tr.querySelectorAll('.edit-input').forEach(input => {
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); saveAllEdits(); }
        });
    });
    tr.querySelector('[data-action="delete"]').addEventListener('click', () => {
        if (!confirm(`Delete "${w.swedish}"? This can't be undone.`)) return;
        pendingDeleteIds.push(w.id);
        allWords = allWords.filter(x => x.id !== w.id);
        tr.remove();
    });
}

function renderNewRow(draft) {
    const tr = document.createElement('tr');
    tr.classList.add('editing-row');
    tr.dataset.tempId = draft.tempId;
    tr.innerHTML = `
        <td><input type="text" class="edit-input new-swedish" placeholder="Swedish word"></td>
        <td><input type="text" class="edit-input new-english" placeholder="English"></td>
        <td class="correct-pct none">—</td>
        <td></td>
        <td><button class="icon-btn danger small" data-action="remove-draft" title="Remove" aria-label="Remove">${TRASH_ICON}</button></td>
    `;
    tr.querySelectorAll('.edit-input').forEach(input => {
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); saveAllEdits(); }
        });
    });
    tr.querySelector('[data-action="remove-draft"]').addEventListener('click', () => {
        newRows = newRows.filter(d => d.tempId !== draft.tempId);
        tr.remove();
    });
    return tr;
}

function appendAddRowFooter() {
    const tbody = document.getElementById('word-rows');
    const tr = document.createElement('tr');
    tr.id = 'add-word-row';
    tr.innerHTML = `<td colspan="5"><button class="secondary" id="add-word-btn">+ Add word</button></td>`;
    tbody.appendChild(tr);
    document.getElementById('add-word-btn').addEventListener('click', () => {
        tempIdCounter++;
        const draft = {tempId: `new${tempIdCounter}`};
        newRows.push(draft);
        const newTr = renderNewRow(draft);
        tbody.insertBefore(newTr, tr);
        newTr.querySelector('.new-swedish').focus();
    });
}

function renderRow(w) {
    const tr = document.createElement('tr');
    tr.dataset.id = w.id;
    if (editMode) renderEditableRow(tr, w); else renderDisplayRow(tr, w);
    return tr;
}

function updateSummary() {
    const known = allWords.filter(w => w.known).length;
    document.getElementById('summary').textContent = `${allWords.length} words · ${known} known`;
}

async function loadWords() {
    const res = await fetch(`/api/lessons/${lessonId}/words`);
    allWords = await res.json();
    sortWords();
    rerenderRows();
    updateSummary();
}

function setEditToggleButton() {
    const btn = document.getElementById('edit-toggle-btn');
    btn.innerHTML = editMode ? SAVE_ICON : EDIT_ICON;
    btn.title = editMode ? 'Save changes' : 'Edit vocabulary';
    btn.setAttribute('aria-label', btn.title);
}

async function saveAllEdits() {
    const btn = document.getElementById('edit-toggle-btn');
    btn.disabled = true;

    for (const id of pendingDeleteIds) {
        await fetch(`/api/words/${id}`, {method: 'DELETE'});
    }
    pendingDeleteIds = [];

    for (const tr of document.querySelectorAll('#word-rows tr')) {
        if (!tr.dataset.id) continue; // skip the add-word footer and new-word drafts
        const w = allWords.find(x => String(x.id) === tr.dataset.id);
        if (!w) continue;
        const swedishInput = tr.querySelector('.edit-swedish');
        const englishInput = tr.querySelector('.edit-english');
        const swedish = swedishInput.value.trim();
        const english = englishInput.value.trim();
        if (!swedish || (swedish === w.swedish && english === w.english)) continue;
        const res = await fetch(`/api/words/${w.id}`, {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({swedish, english})
        });
        Object.assign(w, await res.json());
    }

    for (const draft of newRows) {
        const tr = document.querySelector(`#word-rows tr[data-temp-id="${draft.tempId}"]`);
        if (!tr) continue;
        const swedish = tr.querySelector('.new-swedish').value.trim();
        const english = tr.querySelector('.new-english').value.trim();
        if (!swedish) continue; // blank drafts are just discarded
        const res = await fetch(`/api/lessons/${lessonId}/words`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({swedish, english})
        });
        allWords.push(await res.json());
    }
    newRows = [];

    btn.disabled = false;
    editMode = false;
    setEditToggleButton();
    setFilterControlsDisabled(false);
    sortWords();
    rerenderRows();
    updateSummary();
    loadQuizActions();
}

document.getElementById('edit-toggle-btn').addEventListener('click', () => {
    if (editMode) {
        saveAllEdits();
    } else {
        editMode = true;
        newRows = [];
        pendingDeleteIds = [];
        setEditToggleButton();
        setFilterControlsDisabled(true);
        document.querySelectorAll('#word-rows tr').forEach(tr => {
            const w = allWords.find(x => String(x.id) === tr.dataset.id);
            renderEditableRow(tr, w);
        });
        appendAddRowFooter();
        const first = document.querySelector('.edit-swedish');
        if (first) first.focus();
    }
});

async function loadQuizActions() {
    const res = await fetch(`/api/lessons/${lessonId}/quiz-status`);
    const status = await res.json();
    const area = document.getElementById('quiz-actions');

    if (status.in_progress) {
        area.innerHTML = `
            <button id="continue-btn">Continue current quiz (${status.done} / ${status.total})</button>
            <button class="secondary" id="restart-btn">Restart quiz</button>
        `;
        document.getElementById('continue-btn').addEventListener('click', () => {
            location.href = `/quiz/${lessonId}`;
        });
        document.getElementById('restart-btn').addEventListener('click', async () => {
            if (!confirm('Abandon the current quiz round and start a new one? (Your known words and correct/wrong stats are kept.)')) return;
            await fetch(`/api/lessons/${lessonId}/quiz-restart`, {method: 'POST'});
            location.href = `/quiz/${lessonId}`;
        });
    } else {
        const mistakesBtn = status.mistake_count > 0
            ? `<button class="secondary" id="mistakes-btn">Exercise mistakes (${status.mistake_count})</button>`
            : '';
        area.innerHTML = `<button id="quiz-btn">Quiz this lesson</button>${mistakesBtn}`;
        document.getElementById('quiz-btn').addEventListener('click', () => {
            location.href = `/quiz/${lessonId}`;
        });
        if (status.mistake_count > 0) {
            document.getElementById('mistakes-btn').addEventListener('click', () => {
                location.href = `/quiz/${lessonId}?mode=mistakes`;
            });
        }
    }
}

document.getElementById('reset-btn').addEventListener('click', async () => {
    if (!confirm('Reset all progress (correct/wrong counts and known flags) for this lesson?')) return;
    await fetch(`/api/lessons/${lessonId}/reset-progress`, {method: 'POST'});
    loadWords();
    loadQuizActions();
});

function updateSortButton() {
    const btn = document.getElementById('sort-toggle-btn');
    btn.innerHTML = sortDirection === 'asc' ? ARROW_UP_ICON : ARROW_DOWN_ICON;
    btn.title = sortDirection === 'asc' ? 'Sorted worst first (click for best first)' : 'Sorted best first (click for worst first)';
    btn.setAttribute('aria-label', btn.title);
}
updateSortButton();
document.getElementById('sort-toggle-btn').addEventListener('click', () => {
    sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
    localStorage.setItem('sortDirection', sortDirection);
    updateSortButton();
    sortWords();
    rerenderRows();
});

const hideKnownCb = document.getElementById('hide-known-cb');
hideKnownCb.checked = hideKnown;
hideKnownCb.addEventListener('change', (e) => {
    hideKnown = e.target.checked;
    localStorage.setItem('hideKnown', hideKnown);
    rerenderRows();
});

function setFilterControlsDisabled(disabled) {
    document.getElementById('sort-toggle-btn').disabled = disabled;
    hideKnownCb.disabled = disabled;
}

async function loadExercisesLink() {
    const link = document.getElementById('exercises-link');
    try {
        const res = await fetch(`/api/lessons/${lessonId}/exercises`);
        const data = await res.json();
        if (!data.items.length) { link.textContent = 'Exercises'; return; }
        const done = data.graded_solved === data.graded_total && data.graded_total > 0;
        link.textContent = `Exercises (${data.graded_solved}/${data.graded_total})`;
        link.classList.toggle('done', done);
    } catch (e) { /* leave the plain label */ }
}

loadWords();
loadQuizActions();
loadExercisesLink();
</script>
</body>
</html>
