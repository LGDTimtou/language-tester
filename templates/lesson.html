<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ lesson['title'] }} — Swedish Vocab Trainer</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
    <a class="back-link" href="/">&larr; All lessons</a>
    <header class="top">
        <div>
            <h1>{{ lesson['number'] }}. {{ lesson['title'] }}</h1>
            <div class="subtitle" id="summary">Loading…</div>
        </div>
        {% if lesson['best_score'] is not none %}
        <div class="best-score-block">
            <div class="best-score-label">Best score</div>
            <div class="score-badge large {{ score_class }}">{{ lesson['best_score'] }}%</div>
        </div>
        {% endif %}
    </header>

    <div class="actions-row spread">
        <div class="btn-group" id="quiz-actions"></div>
        <div class="btn-group">
            <button id="edit-toggle-btn" class="icon-btn" title="Edit vocabulary" aria-label="Edit vocabulary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
            </button>
            <button id="reset-btn" class="icon-btn danger" title="Reset progress" aria-label="Reset progress">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path></svg>
            </button>
        </div>
    </div>

    <table class="words">
        <thead>
            <tr>
                <th>Word</th>
                <th>English</th>
                <th>Correct %</th>
                <th>Known</th>
            </tr>
        </thead>
        <tbody id="word-rows"></tbody>
    </table>
</div>

<script>
const lessonId = {{ lesson['id'] }};
const EDIT_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>`;
const SAVE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>`;

let allWords = [];
let editMode = false;

function correctPctClass(w) {
    if (w.wrong_pct === null) return 'none';
    const correctPct = 100 - w.wrong_pct;
    if (correctPct === 100) return 'perfect';
    if (correctPct <= 60) return 'low';
    return '';
}

function correctPctText(w) {
    return w.wrong_pct === null ? '—' : (100 - w.wrong_pct) + '%';
}

function sortWords() {
    allWords.sort((a, b) => {
        if (a.known !== b.known) return a.known ? 1 : -1;
        const aw = a.wrong_pct === null ? -1 : a.wrong_pct;
        const bw = b.wrong_pct === null ? -1 : b.wrong_pct;
        return bw - aw;
    });
}

function rerenderRows() {
    const tbody = document.getElementById('word-rows');
    tbody.innerHTML = '';
    allWords.forEach(w => tbody.appendChild(renderRow(w)));
}

function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s || '';
    return div.innerHTML;
}

function renderDisplayRow(tr, w) {
    tr.classList.remove('editing-row');
    if (w.known) tr.classList.add('known-row'); else tr.classList.remove('known-row');
    if (w.tense) tr.classList.add('verb-row');

    const tenseBadge = w.tense ? `<span class="tense-badge">${w.tense}</span>` : '';

    tr.innerHTML = `
        <td>${escapeHtml(w.swedish)}${tenseBadge}</td>
        <td>${escapeHtml(w.english)}</td>
        <td class="correct-pct ${correctPctClass(w)}">${correctPctText(w)}</td>
        <td><input type="checkbox" ${w.known ? 'checked' : ''}></td>
    `;
    tr.querySelector('input').addEventListener('change', async (e) => {
        await fetch(`/api/words/${w.id}/known`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({known: e.target.checked})
        });
        w.known = e.target.checked;
        updateSummary();
        loadQuizActions();
        sortWords();
        rerenderRows();
    });
}

function renderEditableRow(tr, w) {
    tr.classList.add('editing-row');
    const tenseBadge = w.tense ? `<span class="tense-badge">${w.tense}</span>` : '';

    tr.innerHTML = `
        <td><input type="text" class="edit-input edit-swedish" value="${escapeHtml(w.swedish)}">${tenseBadge}</td>
        <td><input type="text" class="edit-input edit-english" value="${escapeHtml(w.english)}"></td>
        <td class="correct-pct ${correctPctClass(w)}">${correctPctText(w)}</td>
        <td><input type="checkbox" ${w.known ? 'checked' : ''}></td>
    `;
    tr.querySelector('input[type="checkbox"]').addEventListener('change', async (e) => {
        await fetch(`/api/words/${w.id}/known`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({known: e.target.checked})
        });
        w.known = e.target.checked;
        updateSummary();
        loadQuizActions();
    });
    tr.querySelectorAll('.edit-input').forEach(input => {
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); saveAllEdits(); }
        });
    });
}

function renderRow(w) {
    const tr = document.createElement('tr');
    tr.dataset.id = w.id;
    if (editMode) renderEditableRow(tr, w); else renderDisplayRow(tr, w);
    return tr;
}

function updateSummary() {
    const known = allWords.filter(w => w.known).length;
    document.getElementById('summary').textContent = `${allWords.length} words · ${known} known`;
}

async function loadWords() {
    const res = await fetch(`/api/lessons/${lessonId}/words`);
    allWords = await res.json();
    sortWords();
    rerenderRows();
    updateSummary();
}

function setEditToggleButton() {
    const btn = document.getElementById('edit-toggle-btn');
    btn.innerHTML = editMode ? SAVE_ICON : EDIT_ICON;
    btn.title = editMode ? 'Save changes' : 'Edit vocabulary';
    btn.setAttribute('aria-label', btn.title);
}

async function saveAllEdits() {
    const btn = document.getElementById('edit-toggle-btn');
    btn.disabled = true;
    for (const tr of document.querySelectorAll('#word-rows tr')) {
        const w = allWords.find(x => String(x.id) === tr.dataset.id);
        const swedishInput = tr.querySelector('.edit-swedish');
        const englishInput = tr.querySelector('.edit-english');
        const swedish = swedishInput.value.trim();
        const english = englishInput.value.trim();
        if (!swedish || (swedish === w.swedish && english === w.english)) continue;
        const res = await fetch(`/api/words/${w.id}`, {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({swedish, english})
        });
        Object.assign(w, await res.json());
    }
    btn.disabled = false;
    editMode = false;
    setEditToggleButton();
    document.querySelectorAll('#word-rows tr').forEach(tr => {
        const w = allWords.find(x => String(x.id) === tr.dataset.id);
        renderDisplayRow(tr, w);
    });
    updateSummary();
}

document.getElementById('edit-toggle-btn').addEventListener('click', () => {
    if (editMode) {
        saveAllEdits();
    } else {
        editMode = true;
        setEditToggleButton();
        document.querySelectorAll('#word-rows tr').forEach(tr => {
            const w = allWords.find(x => String(x.id) === tr.dataset.id);
            renderEditableRow(tr, w);
        });
        const first = document.querySelector('.edit-swedish');
        if (first) first.focus();
    }
});

async function loadQuizActions() {
    const res = await fetch(`/api/lessons/${lessonId}/quiz-status`);
    const status = await res.json();
    const area = document.getElementById('quiz-actions');

    if (status.in_progress) {
        area.innerHTML = `
            <button id="continue-btn">Continue current quiz (${status.done} / ${status.total})</button>
            <button class="secondary" id="restart-btn">Restart quiz</button>
        `;
        document.getElementById('continue-btn').addEventListener('click', () => {
            location.href = `/quiz/${lessonId}`;
        });
        document.getElementById('restart-btn').addEventListener('click', async () => {
            if (!confirm('Abandon the current quiz round and start a new one? (Your known words and correct/wrong stats are kept.)')) return;
            await fetch(`/api/lessons/${lessonId}/quiz-restart`, {method: 'POST'});
            location.href = `/quiz/${lessonId}`;
        });
    } else {
        area.innerHTML = `<button id="quiz-btn">Quiz this lesson</button>`;
        document.getElementById('quiz-btn').addEventListener('click', () => {
            location.href = `/quiz/${lessonId}`;
        });
    }
}

document.getElementById('reset-btn').addEventListener('click', async () => {
    if (!confirm('Reset all progress (correct/wrong counts and known flags) for this lesson?')) return;
    await fetch(`/api/lessons/${lessonId}/reset-progress`, {method: 'POST'});
    loadWords();
    loadQuizActions();
});

loadWords();
loadQuizActions();
</script>
</body>
</html>
