<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercises: {{ lesson['title'] }} — Swedish Vocab Trainer</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
    <a class="back-link" href="/lesson/{{ lesson['id'] }}">&larr; {{ lesson['title'] }}</a>
    <header class="top">
        <div>
            <h1>Exercises: {{ lesson['number'] }}. {{ lesson['title'] }}</h1>
            <div class="subtitle" id="summary">Loading…</div>
        </div>
        <div class="btn-group">
            <button id="edit-answers-btn" class="icon-btn" title="Edit the accepted answers" aria-label="Edit the accepted answers">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
            </button>
            <button id="reset-btn" class="icon-btn danger" title="Reset exercise progress" aria-label="Reset exercise progress">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path></svg>
            </button>
        </div>
    </header>

    <div id="banner" hidden></div>
    <div id="exercise-area">Loading…</div>
</div>

<div class="check-bar">
    <div class="wrap check-bar-inner">
        <span id="check-progress" class="check-progress"></span>
        <button id="check-btn">Check</button>
    </div>
</div>

<div class="check-bar" id="answer-bar" hidden>
    <div class="wrap check-bar-inner">
        <span class="check-progress" id="answer-hint">Editing accepted answers — changes are saved to exercises_data/{{ lesson['number'] }}.json</span>
        <button class="secondary" id="answer-cancel-btn">Cancel</button>
        <button id="answer-save-btn">Save answers</button>
    </div>
</div>

<div class="modal-overlay" id="done-modal">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="done-modal-title">
        <div class="modal-emoji">🎉</div>
        <h2 id="done-modal-title">Everything correct!</h2>
        <p>You got every exercise in this lesson right.</p>
        <div class="modal-buttons">
            <a class="btn" href="/lesson/{{ lesson['id'] }}">Back to word list</a>
            <button class="btn secondary" id="modal-review-btn">Stay and review</button>
        </div>
    </div>
</div>

<script>
const lessonId = {{ lesson['id'] }};

const CHECK_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
const CROSS_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
const EYE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
const EYE_OFF_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
const PENCIL_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>`;
const GRADER_LABELS = {text: 'Fill in / translate', set: 'Write several (set)', choice: 'Multiple choice', table: 'Vocabulary table'};

let items = [];
let checkedOnce = false;
let saveTimer = null;

function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s == null ? '' : s;
    return d.innerHTML;
}

// ---------- rendering ----------

function inputEl(cls, value) {
    const i = document.createElement('input');
    i.type = 'text';
    i.className = cls;
    i.autocomplete = 'off';
    i.spellcheck = false;
    if (value != null) i.value = value;
    i.addEventListener('input', scheduleSave);
    return i;
}

function renderTextBody(container, it) {
    const prompt = it.prompt || '';
    const nBlanks = (it.render && it.render.n_blanks) || 1;
    const segs = prompt.split(/_{2,}/);
    const wrap = document.createElement('div');
    wrap.className = 'ex-prompt';
    const last = (it.last_answer && Array.isArray(it.last_answer)) ? it.last_answer : [];

    if (segs.length > 1) {
        segs.forEach((seg, idx) => {
            if (seg) wrap.appendChild(document.createTextNode(seg));
            if (idx < segs.length - 1) {
                wrap.appendChild(inputEl('ex-input ex-blank', last[idx] || ''));
            }
        });
        // top up if the author declared more blanks than the prompt shows
        for (let k = segs.length - 1; k < nBlanks; k++) {
            wrap.appendChild(inputEl('ex-input ex-blank', last[k] || ''));
        }
    } else {
        wrap.appendChild(document.createTextNode(prompt + ' '));
        for (let k = 0; k < nBlanks; k++) {
            wrap.appendChild(inputEl('ex-input ex-blank', last[k] || ''));
        }
    }
    container.appendChild(wrap);
}

function renderSetBody(container, it) {
    const n = (it.render && it.render.n_required) || 1;
    const last = (it.last_answer && Array.isArray(it.last_answer)) ? it.last_answer : [];
    const p = document.createElement('div');
    p.className = 'ex-prompt';
    p.textContent = it.prompt + ` (${n})`;
    container.appendChild(p);
    const list = document.createElement('div');
    list.className = 'ex-set';
    for (let k = 0; k < n; k++) list.appendChild(inputEl('ex-input', last[k] || ''));
    container.appendChild(list);
}

function renderChoiceBody(container, it) {
    const opts = (it.render && it.render.options) || [];
    const p = document.createElement('div');
    p.className = 'ex-prompt';
    p.textContent = (it.prompt || '').replace(/_{2,}/, ' ___ ');
    container.appendChild(p);
    const list = document.createElement('div');
    list.className = 'ex-choices';
    opts.forEach(opt => {
        const id = `ch-${it.id}-${opt}`;
        const label = document.createElement('label');
        label.className = 'ex-choice';
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = `choice-${it.id}`;
        radio.value = opt;
        radio.id = id;
        if (it.last_answer === opt) radio.checked = true;
        radio.addEventListener('change', scheduleSave);
        label.appendChild(radio);
        label.appendChild(document.createTextNode(' ' + opt));
        list.appendChild(label);
    });
    container.appendChild(list);
}

function renderTableBody(container, it) {
    const rows = (it.render && it.render.rows) || [];
    const last = (it.last_answer && Array.isArray(it.last_answer)) ? it.last_answer : [];
    const p = document.createElement('div');
    p.className = 'ex-prompt';
    p.textContent = it.prompt;
    container.appendChild(p);

    const table = document.createElement('table');
    table.className = 'ex-table';
    table.innerHTML = '<thead><tr><th>Swedish</th><th>English</th></tr></thead>';
    const tbody = document.createElement('tbody');
    let blankIdx = 0;
    rows.forEach(r => {
        const tr = document.createElement('tr');
        const tdSv = document.createElement('td');
        const tdEn = document.createElement('td');
        const givenSv = r.given_side === 'sv';
        if (givenSv) {
            tdSv.textContent = r.given;
            if (r.blank) { const bi = blankIdx++; tdEn.appendChild(inputEl('ex-input', last[bi] || '')); }
            else tdEn.textContent = '';
        } else {
            tdEn.textContent = r.given;
            if (r.blank) { const bi = blankIdx++; tdSv.appendChild(inputEl('ex-input', last[bi] || '')); }
            else tdSv.textContent = '';
        }
        tr.appendChild(tdSv);
        tr.appendChild(tdEn);
        tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    container.appendChild(table);
}

function renderOpenBody(container, it) {
    const p = document.createElement('div');
    p.className = 'ex-prompt';
    p.textContent = it.prompt;
    container.appendChild(p);

    const ta = document.createElement('textarea');
    ta.className = 'ex-textarea';
    ta.rows = 3;
    ta.value = (typeof it.last_answer === 'string') ? it.last_answer : '';
    ta.addEventListener('input', scheduleSave);
    container.appendChild(ta);

    const foot = document.createElement('div');
    foot.className = 'ex-open-foot';
    const label = document.createElement('label');
    label.className = 'filter-check';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!it.self_done;
    cb.addEventListener('change', async () => {
        await fetch(`/api/exercises/${it.id}/self-done`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({done: cb.checked, answer: ta.value}),
        });
        it.self_done = cb.checked;
        refDiv.hidden = !(cb.checked || checkedOnce) || !(it.reference && it.reference.length);
        updateSummary();
    });
    label.appendChild(cb);
    label.appendChild(document.createTextNode(' Mark done'));
    foot.appendChild(label);
    container.appendChild(foot);

    const refDiv = document.createElement('div');
    refDiv.className = 'ex-reference';
    if (it.reference && it.reference.length) {
        refDiv.innerHTML = '<div class="ex-reference-label">Reference answer</div>' +
            it.reference.map(r => `<div>${escapeHtml(r)}</div>`).join('');
    } else {
        refDiv.innerHTML = '<div class="ex-reference-label">The PDF gives no fixed answer for this one.</div>';
    }
    refDiv.hidden = !(it.self_done || checkedOnce);
    container.appendChild(refDiv);
}

const BODY_RENDERERS = {
    text: renderTextBody, set: renderSetBody, choice: renderChoiceBody, table: renderTableBody,
};

function renderItem(it) {
    const card = document.createElement('div');
    card.className = 'ex-item' + (it.kind === 'open' ? ' ex-item-open' : '');
    card.dataset.id = it.id;

    const mark = document.createElement('span');
    mark.className = 'ex-mark-slot';
    card.appendChild(mark);

    const body = document.createElement('div');
    body.className = 'ex-body';
    if (it.kind === 'open') renderOpenBody(body, it);
    else (BODY_RENDERERS[it.grader] || renderTextBody)(body, it);
    card.appendChild(body);

    if (it.kind === 'graded') {
        const controls = document.createElement('div');
        controls.className = 'ex-controls';

        const eye = document.createElement('button');
        eye.className = 'ex-mini-btn ex-eye-btn';
        eye.type = 'button';
        eye.title = 'Show the correct answer';
        eye.innerHTML = EYE_ICON;
        eye.addEventListener('click', () => toggleReveal(card, it, eye));
        controls.appendChild(eye);

        const pen = document.createElement('button');
        pen.className = 'ex-mini-btn ex-edit-btn';
        pen.type = 'button';
        pen.title = 'Edit this exercise';
        pen.innerHTML = PENCIL_ICON;
        pen.hidden = true;
        pen.addEventListener('click', () => openInlineEdit(card, it));
        controls.appendChild(pen);

        card.appendChild(controls);

        const panel = document.createElement('div');
        panel.className = 'ex-panel';
        panel.hidden = true;
        card.appendChild(panel);
    }

    if (it.kind === 'graded' && it.solved) setMark(card, true);
    return card;
}

// ---------- reveal the correct answer for one item ----------

function answerHtml(detail) {
    const e = detail.editable || {};
    if (detail.grader === 'text') {
        return (e.blanks || []).map((acc, i) =>
            `<div>${e.blanks.length > 1 ? `Blank ${i + 1}: ` : ''}<b>${(acc || []).map(escapeHtml).join('</b> or <b>')}</b></div>`
        ).join('');
    }
    if (detail.grader === 'set') {
        return `<div>Any ${e.n_required} of: <b>${(e.accept_pool || []).map(escapeHtml).join('</b>, <b>')}</b></div>`;
    }
    if (detail.grader === 'choice') {
        return `<div>Correct: <b>${(e.correct || []).map(escapeHtml).join('</b> / <b>')}</b></div>`;
    }
    if (detail.grader === 'table') {
        return (e.rows || []).filter(r => r.accept && r.accept.length).map(r =>
            `<div>${escapeHtml(r.given)} ${r.given_side === 'sv' ? '→' : '←'} <b>${r.accept.map(escapeHtml).join('</b> or <b>')}</b></div>`
        ).join('');
    }
    return '';
}

async function toggleReveal(card, it, eyeBtn) {
    const panel = card.querySelector('.ex-panel');
    const pen = card.querySelector('.ex-edit-btn');
    if (panel.dataset.mode === 'edit') return;          // don't toggle while editing
    if (!panel.hidden) {
        panel.hidden = true;
        pen.hidden = true;
        eyeBtn.innerHTML = EYE_ICON;
        eyeBtn.classList.remove('active');
        return;
    }
    const detail = await (await fetch(`/api/exercises/${it.id}`)).json();
    card._detail = detail;
    showRevealPanel(card);
    eyeBtn.innerHTML = EYE_OFF_ICON;
    eyeBtn.classList.add('active');
}

function showRevealPanel(card) {
    const panel = card.querySelector('.ex-panel');
    panel.dataset.mode = 'reveal';
    panel.innerHTML = `<div class="ex-answer-label">Correct answer</div>${answerHtml(card._detail)}`;
    panel.hidden = false;
    card.querySelector('.ex-edit-btn').hidden = false;
}

// ---------- inline edit of one item (answers, type, prompt, heading) ----------

function pipeJoin(a) { return (a || []).join('  |  '); }
function pipeSplit(s) { return (s || '').split('|').map(x => x.trim()).filter(Boolean); }

function graderFieldsInline(grader, e) {
    e = e || {};
    const box = document.createElement('div');
    box.className = 'ex-edit-fields';
    const row = (labelText, node) => {
        const l = document.createElement('label');
        l.className = 'ans-row';
        const s = document.createElement('span');
        s.className = 'ans-label';
        s.textContent = labelText;
        l.appendChild(s); l.appendChild(node); box.appendChild(l);
        return node;
    };
    const tin = (v) => {
        const i = document.createElement('input');
        i.type = 'text'; i.className = 'ans-edit'; i.value = v || ''; i.spellcheck = false;
        return i;
    };
    let collect;

    if (grader === 'text') {
        const blanks = (e.blanks && e.blanks.length) ? e.blanks : [[]];
        const inputs = blanks.map((acc, i) =>
            row(blanks.length > 1 ? `Blank ${i + 1} accepts` : 'Accepts', tin(pipeJoin(acc))));
        const addWrap = document.createElement('div');
        addWrap.className = 'ans-row';
        addWrap.appendChild(document.createElement('span'));
        const addBtn = document.createElement('button');
        addBtn.type = 'button'; addBtn.className = 'secondary tiny'; addBtn.textContent = '+ blank';
        addBtn.addEventListener('click', () => {
            const inp = tin('');
            inputs.push(inp);
            box.insertBefore(row(`Blank ${inputs.length} accepts`, inp), addWrap);
        });
        addWrap.appendChild(addBtn);
        box.appendChild(addWrap);
        collect = () => ({blanks: inputs.map(i => pipeSplit(i.value))});

    } else if (grader === 'set') {
        const ta = document.createElement('textarea');
        ta.className = 'ans-edit ans-pool';
        ta.rows = Math.min(12, (e.accept_pool || []).length + 2);
        ta.value = (e.accept_pool || []).join('\n');
        row('Accepted pool (one per line)', ta);
        const n = document.createElement('input');
        n.type = 'number'; n.min = '1'; n.className = 'ans-edit ans-n';
        n.value = e.n_required || 1;
        row('How many required', n);
        collect = () => ({
            accept_pool: ta.value.split('\n').map(x => x.trim()).filter(Boolean),
            n_required: parseInt(n.value, 10) || 1,
        });

    } else if (grader === 'choice') {
        const optIn = row('Options', tin((e.options || []).join('  |  ')));
        const corIn = row('Correct', tin(pipeJoin(e.correct)));
        collect = () => ({options: pipeSplit(optIn.value), correct: pipeSplit(corIn.value)});

    } else if (grader === 'table') {
        const rowsBox = document.createElement('div');
        const rowNodes = [];
        const addRow = (r) => {
            r = r || {given: '', given_side: 'sv', accept: []};
            const wrap = document.createElement('div');
            wrap.className = 'ans-row ex-table-editrow';
            const g = tin(r.given); g.placeholder = 'given (shown)';
            const side = document.createElement('select');
            side.className = 'ans-edit ans-side';
            side.innerHTML = '<option value="sv">given = Swedish</option><option value="en">given = English</option>';
            side.value = r.given_side === 'en' ? 'en' : 'sv';
            const acc = tin(pipeJoin(r.accept)); acc.placeholder = 'accepted answer(s)';
            const del = document.createElement('button');
            del.type = 'button'; del.className = 'secondary tiny'; del.textContent = '×';
            del.addEventListener('click', () => { wrap.remove(); rowNodes.splice(rowNodes.indexOf(entry), 1); });
            wrap.append(g, side, acc, del);
            rowsBox.appendChild(wrap);
            const entry = {g, side, acc};
            rowNodes.push(entry);
        };
        (e.rows && e.rows.length ? e.rows : [null]).forEach(addRow);
        box.appendChild(rowsBox);
        const addBtn = document.createElement('button');
        addBtn.type = 'button'; addBtn.className = 'secondary tiny'; addBtn.textContent = '+ row';
        addBtn.addEventListener('click', () => addRow(null));
        box.appendChild(addBtn);
        collect = () => ({rows: rowNodes.map(n => ({
            given: n.g.value.trim(), given_side: n.side.value, accept: pipeSplit(n.acc.value),
        }))});
    } else {
        collect = () => ({});
    }
    return {node: box, collect};
}

async function openInlineEdit(card, it) {
    const panel = card.querySelector('.ex-panel');
    let detail = card._detail;
    if (!detail) { detail = await (await fetch(`/api/exercises/${it.id}`)).json(); card._detail = detail; }
    panel.dataset.mode = 'edit';
    panel.hidden = false;
    panel.innerHTML = '';

    const form = document.createElement('div');
    form.className = 'ex-inline-form';

    // type
    const typeSel = document.createElement('select');
    typeSel.className = 'ans-edit';
    Object.entries(GRADER_LABELS).forEach(([g, lbl]) => {
        const o = document.createElement('option');
        o.value = g; o.textContent = lbl; if (g === detail.grader) o.selected = true;
        typeSel.appendChild(o);
    });
    const typeRow = mkRow('Type', typeSel); form.appendChild(typeRow);

    // heading
    const headIn = document.createElement('input');
    headIn.type = 'text'; headIn.className = 'ans-edit';
    headIn.placeholder = '(no heading)';
    headIn.value = detail.section || '';
    form.appendChild(mkRow('Heading above', headIn));

    // prompt
    const promptTa = document.createElement('textarea');
    promptTa.className = 'ans-edit'; promptTa.rows = 2; promptTa.value = detail.prompt || '';
    form.appendChild(mkRow('Prompt', promptTa));
    const promptHint = document.createElement('div');
    promptHint.className = 'ans-hint';
    promptHint.textContent = 'Use ____ where an answer blank should appear (fill-in / table).';
    form.appendChild(promptHint);

    // grader-specific fields
    let fields = graderFieldsInline(detail.grader, detail.editable);
    const fieldWrap = document.createElement('div');
    fieldWrap.appendChild(fields.node);
    form.appendChild(fieldWrap);

    typeSel.addEventListener('change', () => {
        // pre-fill the new type's fields from whatever answers we already have
        const flat = flattenAnswers(detail);
        const seed = seedForGrader(typeSel.value, flat, detail.editable);
        fields = graderFieldsInline(typeSel.value, seed);
        fieldWrap.innerHTML = '';
        fieldWrap.appendChild(fields.node);
    });

    const err = document.createElement('div');
    err.className = 'ex-inline-err'; err.hidden = true;
    form.appendChild(err);

    const btns = document.createElement('div');
    btns.className = 'ex-inline-btns';
    const save = document.createElement('button'); save.textContent = 'Save';
    const cancel = document.createElement('button');
    cancel.className = 'secondary'; cancel.textContent = 'Cancel';
    btns.append(save, cancel);
    form.appendChild(btns);
    panel.appendChild(form);

    cancel.addEventListener('click', () => { showRevealPanel(card); });
    save.addEventListener('click', async () => {
        save.disabled = true;
        err.hidden = true;
        const body = {
            grader: typeSel.value,
            form: fields.collect(),
            prompt: promptTa.value.trim(),
        };
        if ((headIn.value.trim() || '') !== (detail.section || '')) body.heading = headIn.value.trim();
        const res = await fetch(`/api/exercises/${it.id}`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) { err.textContent = data.error || 'Could not save.'; err.hidden = false; save.disabled = false; return; }
        const y = window.scrollY;
        await loadExercises();
        window.scrollTo({top: y});
        showBanner('Exercise updated' + (data.json_updated ? ' and saved to the lesson file.' : '.'), true);
    });
}

function mkRow(labelText, node) {
    const l = document.createElement('label');
    l.className = 'ans-row';
    const s = document.createElement('span');
    s.className = 'ans-label'; s.textContent = labelText;
    l.appendChild(s); l.appendChild(node);
    return l;
}

function flattenAnswers(detail) {
    const e = detail.editable || {};
    if (detail.grader === 'text') return [].concat(...(e.blanks || []));
    if (detail.grader === 'set') return e.accept_pool || [];
    if (detail.grader === 'choice') return e.correct || [];
    if (detail.grader === 'table') return [].concat(...((e.rows || []).map(r => r.accept || [])));
    return [];
}

function seedForGrader(grader, flat, origEditable) {
    if (grader === 'text') return {blanks: [flat.length ? flat : ['']]};
    if (grader === 'set') return {accept_pool: flat, n_required: Math.min(3, flat.length) || 1};
    if (grader === 'choice') return {options: (origEditable && origEditable.options) || flat, correct: flat.slice(0, 1)};
    if (grader === 'table') return {rows: (origEditable && origEditable.rows) || [{given: '', given_side: 'sv', accept: flat}]};
    return {};
}

function showBanner(text, good) {
    const b = document.getElementById('banner');
    b.hidden = false;
    b.className = 'ex-banner' + (good ? ' good' : '');
    b.textContent = text;
}

function setMark(card, ok) {
    card.classList.remove('item-correct', 'item-wrong');
    card.classList.add(ok ? 'item-correct' : 'item-wrong');
    const slot = card.querySelector('.ex-mark-slot');
    slot.innerHTML = ok ? CHECK_ICON : CROSS_ICON;
}

function render() {
    const area = document.getElementById('exercise-area');
    area.innerHTML = '';
    if (!items.length) {
        area.innerHTML = '<div class="empty-note">No exercises have been loaded for this lesson yet. '
            + 'Run <code>python3 parse_exercises.py</code> after authoring <code>exercises_data/'
            + '{{ lesson["number"] }}.json</code>.</div>';
        document.querySelector('.check-bar').hidden = true;
        return;
    }
    let lastSection = null;
    items.forEach((it, idx) => {
        if ((it.section || null) !== lastSection) {
            area.appendChild(sectionHeading(it.section, it.id));
            lastSection = it.section || null;
        }
        area.appendChild(renderItem(it));
    });
}

function sectionHeading(title, firstItemId) {
    const h = document.createElement('h2');
    h.className = 'ex-section' + (title ? '' : ' ex-section-empty');
    const span = document.createElement('span');
    span.textContent = title || 'No heading here — click to add one';
    h.appendChild(span);
    const edit = document.createElement('button');
    edit.type = 'button';
    edit.className = 'ex-mini-btn ex-section-edit';
    edit.title = 'Rename / add this heading';
    edit.innerHTML = PENCIL_ICON;
    h.appendChild(edit);
    const startEdit = () => {
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.className = 'ex-section-input';
        inp.value = title || '';
        inp.placeholder = 'Heading text (leave blank to remove)';
        h.replaceWith(inp);
        inp.focus();
        const commit = async () => {
            const v = inp.value.trim();
            if (v === (title || '')) { inp.replaceWith(sectionHeading(title, firstItemId)); return; }
            await fetch(`/api/exercises/${firstItemId}/heading`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title: v}),
            });
            const y = window.scrollY;
            await loadExercises();
            window.scrollTo({top: y});
        };
        inp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); commit(); }
            if (e.key === 'Escape') inp.replaceWith(sectionHeading(title, firstItemId));
        });
        inp.addEventListener('blur', commit);
    };
    edit.addEventListener('click', startEdit);
    if (!title) span.addEventListener('click', startEdit);
    return h;
}

// ---------- answers / actions ----------

function collectAnswers() {
    const out = {};
    document.querySelectorAll('.ex-item').forEach(card => {
        const id = card.dataset.id;
        const it = items.find(x => String(x.id) === id);
        if (!it) return;
        if (it.kind === 'open') {
            const ta = card.querySelector('.ex-textarea');
            out[id] = ta ? ta.value : '';
        } else if (it.grader === 'choice') {
            const sel = card.querySelector('input[type="radio"]:checked');
            out[id] = sel ? sel.value : '';
        } else {
            out[id] = Array.from(card.querySelectorAll('input.ex-input')).map(i => i.value);
        }
    });
    return out;
}

function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
        fetch(`/api/lessons/${lessonId}/exercises/save`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({answers: collectAnswers()}),
        });
    }, 800);
}

function updateSummary(graded_solved, graded_total) {
    const graded = items.filter(i => i.kind === 'graded');
    const open = items.filter(i => i.kind === 'open');
    const solved = graded_solved != null ? graded_solved : graded.filter(i => i.solved).length;
    const total = graded_total != null ? graded_total : graded.length;
    const openDone = open.filter(i => i.self_done).length;
    let txt = `${solved} / ${total} exercises correct`;
    if (open.length) txt += ` · ${openDone} / ${open.length} practice items marked done`;
    document.getElementById('summary').textContent = txt;
    document.getElementById('check-progress').textContent = `${solved} / ${total}`;
}

async function loadExercises() {
    const res = await fetch(`/api/lessons/${lessonId}/exercises`);
    const data = await res.json();
    items = data.items;
    render();
    updateSummary(data.graded_solved, data.graded_total);
}

async function runCheck() {
    const btn = document.getElementById('check-btn');
    btn.disabled = true;
    const res = await fetch(`/api/lessons/${lessonId}/exercises/check`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({answers: collectAnswers()}),
    });
    const data = await res.json();
    checkedOnce = true;

    document.querySelectorAll('.ex-item').forEach(card => {
        const id = card.dataset.id;
        if (id in data.results) {
            const ok = data.results[id];
            setMark(card, ok);
            const it = items.find(x => String(x.id) === id);
            if (it) it.solved = ok;
        }
    });
    // reveal every reference now that a check has run
    document.querySelectorAll('.ex-item-open').forEach(card => {
        const it = items.find(x => String(x.id) === card.dataset.id);
        const ref = card.querySelector('.ex-reference');
        if (ref) ref.hidden = false;
    });

    updateSummary(data.graded_solved, data.graded_total);
    btn.disabled = false;

    const banner = document.getElementById('banner');
    if (data.all_solved) {
        banner.hidden = true;
        openDoneModal();
    } else {
        const wrong = data.graded_total - data.graded_solved;
        banner.hidden = false;
        banner.className = 'ex-banner';
        banner.textContent = `${wrong} exercise${wrong === 1 ? '' : 's'} still not correct — fix the ✗ ones and check again.`;
        // jump to the first thing they got wrong
        const firstWrong = document.querySelector('.ex-item.item-wrong');
        if (firstWrong) firstWrong.scrollIntoView({behavior: 'smooth', block: 'center'});
    }
}

function openDoneModal() {
    document.getElementById('done-modal').classList.add('open');
}
function closeDoneModalAndReview() {
    document.getElementById('done-modal').classList.remove('open');
    window.scrollTo({top: 0, behavior: 'smooth'});
}
document.getElementById('modal-review-btn').addEventListener('click', closeDoneModalAndReview);
document.getElementById('done-modal').addEventListener('click', (e) => {
    if (e.target.id === 'done-modal') closeDoneModalAndReview();  // click the backdrop
});
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.getElementById('done-modal').classList.contains('open')) {
        closeDoneModalAndReview();
    }
});

document.getElementById('check-btn').addEventListener('click', runCheck);

document.getElementById('reset-btn').addEventListener('click', async () => {
    if (!confirm('Reset all exercise progress for this lesson? (Typed answers, correct marks and "done" ticks are cleared. Vocabulary quiz progress is not touched.)')) return;
    await fetch(`/api/lessons/${lessonId}/exercises/reset`, {method: 'POST'});
    checkedOnce = false;
    document.getElementById('banner').hidden = true;
    loadExercises();
});

// ---------- editing the accepted answers ----------

let answerEditMode = false;

function splitAlts(str) {
    return (str || '').split('|').map(s => s.trim()).filter(Boolean);
}

function answerEditor(it) {
    const card = document.createElement('div');
    card.className = 'ex-item ans-card';
    card.dataset.id = it.id;
    card.dataset.grader = it.grader;

    const p = document.createElement('div');
    p.className = 'ex-prompt ans-prompt';
    p.textContent = (it.prompt || '').replace(/_{2,}/g, ' ___ ');
    card.appendChild(p);

    const e = it.editable || {};
    const body = document.createElement('div');
    body.className = 'ans-fields';

    const field = (labelText, node) => {
        const row = document.createElement('label');
        row.className = 'ans-row';
        const s = document.createElement('span');
        s.className = 'ans-label';
        s.textContent = labelText;
        row.appendChild(s);
        row.appendChild(node);
        body.appendChild(row);
    };
    const textInput = (val) => {
        const i = document.createElement('input');
        i.type = 'text'; i.className = 'ans-edit'; i.value = val; i.spellcheck = false;
        return i;
    };

    if (it.grader === 'text') {
        (e.blanks || []).forEach((acc, idx) => {
            field((e.blanks.length > 1 ? `Blank ${idx + 1} accepts` : 'Accepts'),
                  textInput((acc || []).join('  |  ')));
        });
    } else if (it.grader === 'table') {
        (e.rows || []).forEach((r) => {
            if (!r.accept || !r.accept.length) return;
            const arrow = r.given_side === 'sv' ? '→' : '←';
            field(`${r.given} ${arrow}`, textInput(r.accept.join('  |  ')));
        });
    } else if (it.grader === 'choice') {
        const opts = document.createElement('span');
        opts.className = 'ans-static';
        opts.textContent = 'Options: ' + (e.options || []).join(', ');
        body.appendChild(opts);
        field('Correct', textInput((e.correct || []).join('  |  ')));
    } else if (it.grader === 'set') {
        const ta = document.createElement('textarea');
        ta.className = 'ans-edit ans-pool'; ta.rows = Math.min(10, (e.accept_pool || []).length + 1);
        ta.value = (e.accept_pool || []).join('\n');
        field('Accepted pool (one per line)', ta);
        const n = document.createElement('input');
        n.type = 'number'; n.min = '1'; n.className = 'ans-edit ans-n'; n.value = e.n_required || 1;
        field('How many required', n);
    }

    card.appendChild(body);
    const hint = document.createElement('div');
    hint.className = 'ans-hint';
    hint.textContent = 'Separate alternatives with  |  (e.g.  a car  |  the car).';
    card.appendChild(hint);
    return card;
}

function collectAnswerEdits() {
    const out = {};
    document.querySelectorAll('.ans-card').forEach(card => {
        const id = card.dataset.id, grader = card.dataset.grader;
        const inputs = [...card.querySelectorAll('input.ans-edit, textarea.ans-edit')];
        if (grader === 'text') {
            out[id] = {blanks: card.querySelectorAll('.ans-row input.ans-edit').length
                ? [...card.querySelectorAll('.ans-row input.ans-edit')].map(i => splitAlts(i.value))
                : []};
        } else if (grader === 'table') {
            out[id] = {rows: [...card.querySelectorAll('.ans-row input.ans-edit')].map(i => splitAlts(i.value))};
        } else if (grader === 'choice') {
            const ci = card.querySelector('.ans-row input.ans-edit');
            out[id] = {correct: splitAlts(ci ? ci.value : '')};
        } else if (grader === 'set') {
            const pool = card.querySelector('textarea.ans-pool');
            const n = card.querySelector('input.ans-n');
            out[id] = {
                accept_pool: (pool ? pool.value : '').split('\n').map(s => s.trim()).filter(Boolean),
                n_required: n ? parseInt(n.value, 10) || 1 : 1,
            };
        }
    });
    return out;
}

async function enterAnswerEdit() {
    answerEditMode = true;
    document.getElementById('banner').hidden = true;
    document.querySelector('.check-bar').hidden = true;
    document.getElementById('answer-bar').hidden = false;
    document.getElementById('edit-answers-btn').classList.add('active');

    const area = document.getElementById('exercise-area');
    area.innerHTML = '<div class="empty-note">Loading answers…</div>';
    const data = await (await fetch(`/api/lessons/${lessonId}/exercises/answers`)).json();
    area.innerHTML = '';
    if (!data.items.length) {
        area.innerHTML = '<div class="empty-note">This lesson has no auto-gradable items to edit.</div>';
        return;
    }
    let lastSection = null;
    data.items.forEach(it => {
        if (it.section && it.section !== lastSection) {
            const h = document.createElement('h2');
            h.className = 'ex-section';
            h.textContent = it.section;
            area.appendChild(h);
            lastSection = it.section;
        }
        area.appendChild(answerEditor(it));
    });
    window.scrollTo({top: 0});
}

function exitAnswerEdit() {
    answerEditMode = false;
    document.getElementById('answer-bar').hidden = true;
    document.querySelector('.check-bar').hidden = false;
    document.getElementById('edit-answers-btn').classList.remove('active');
    loadExercises();
}

document.getElementById('edit-answers-btn').addEventListener('click', () => {
    if (answerEditMode) exitAnswerEdit(); else enterAnswerEdit();
});
document.getElementById('answer-cancel-btn').addEventListener('click', exitAnswerEdit);
document.getElementById('answer-save-btn').addEventListener('click', async () => {
    const btn = document.getElementById('answer-save-btn');
    btn.disabled = true;
    const res = await fetch(`/api/lessons/${lessonId}/exercises/answers`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({items: collectAnswerEdits()}),
    });
    const data = await res.json();
    btn.disabled = false;
    exitAnswerEdit();
    const banner = document.getElementById('banner');
    banner.hidden = false;
    banner.className = 'ex-banner good';
    banner.textContent = data.updated
        ? `Updated ${data.updated} answer${data.updated === 1 ? '' : 's'}` +
          (data.json_updated ? ' (saved to the lesson file).' : ' (DB only — lesson file not found).')
        : 'No changes.';
});

loadExercises();
</script>
