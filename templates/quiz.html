<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz: {{ lesson['title'] }} — Swedish Vocab Trainer</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
    <a class="back-link" href="/lesson/{{ lesson['id'] }}">&larr; {{ lesson['title'] }}</a>
    <header class="top">
        <div>
            <h1 id="quiz-heading">Quiz: {{ lesson['number'] }}. {{ lesson['title'] }}</h1>
        </div>
    </header>

    <div class="direction-toggle">
        Direction: <span id="direction-label"></span>
        <button id="direction-btn">Swap direction</button>
    </div>

    <div id="quiz-area"></div>
</div>

<script>
const lessonId = {{ lesson['id'] }};
const quizMode = new URLSearchParams(location.search).get('mode') === 'mistakes' ? 'mistakes' : 'full';
if (quizMode === 'mistakes') {
    // string-replace on the already-escaped heading text, so titles with
    // apostrophes/quotes never get re-embedded into a JS string literal
    const heading = document.getElementById('quiz-heading');
    heading.textContent = heading.textContent.replace(/^Quiz:/, 'Exercise mistakes:');
}
let current = null;      // current word object
let progress = {pending: 0, done: 0, total: 0, score: null};
let answered = false;
let retrying = false;  // true while re-typing after "It was a typo"
let sessionAnswered = 0;
let sessionCorrect = 0;
let direction = localStorage.getItem('quizDirection') || 'sv'; // 'sv' = type Swedish, 'en' = type English

// --- speech ---
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let answerViaVoice = false;      // this attempt's answer came from the mic
let voiceAlternatives = [];      // the recogniser's guesses, sent for lenient matching
let recognizing = false;

function updateDirectionLabel() {
    document.getElementById('direction-label').textContent =
        direction === 'sv' ? 'See English → type Swedish' : 'See Swedish → type English';
}
updateDirectionLabel();

document.getElementById('direction-btn').addEventListener('click', () => {
    direction = direction === 'sv' ? 'en' : 'sv';
    localStorage.setItem('quizDirection', direction);
    updateDirectionLabel();
    loadNext();
});

function promptText(word) {
    return direction === 'sv' ? (word.english || '(no translation)') : word.swedish;
}

function scoreClass(score) {
    if (score === null || score === undefined) return 'none';
    if (score >= 80) return 'excellent';
    if (score >= 50) return 'fair';
    return 'poor';
}

function progressBarHtml() {
    const pct = progress.total ? Math.round(100 * progress.done / progress.total) : 0;
    return `
        <div class="quiz-progress-wrap">
            <div class="quiz-progress-label">${progress.done} / ${progress.total} mastered this round</div>
            <div class="progress-bar"><div style="width: ${pct}%"></div></div>
        </div>
    `;
}

function renderQuizArea() {
    const area = document.getElementById('quiz-area');
    if (!current) {
        if (progress.done > 0 && progress.score !== null && progress.score !== undefined) {
            const title = quizMode === 'mistakes' ? '🎉 Mistakes practice complete!' : '🎉 Round complete!';
            area.innerHTML = `<div class="quiz-card">
                <div class="finished-note">${title}</div>
                <div class="round-score ${scoreClass(progress.score)}">${progress.score}%</div>
                <div class="round-score-label">correct on the first try (${progress.done} word${progress.done === 1 ? '' : 's'})</div>
                <div class="quiz-buttons">
                    <button id="restart-btn">Start another round</button>
                    <a class="btn secondary" href="/lesson/${lessonId}">Back to word list</a>
                </div>
            </div>`;
        } else {
            const message = quizMode === 'mistakes'
                ? 'No mistakes to practice — nice work! 🎉'
                : 'You already know every word in this lesson!';
            area.innerHTML = `<div class="quiz-card">
                <div class="finished-note">${message}</div>
                <div class="quiz-buttons">
                    <a class="btn secondary" href="/lesson/${lessonId}">Back to word list</a>
                </div>
            </div>`;
        }
        document.getElementById('restart-btn').addEventListener('click', loadNext);
        return;
    }
    const tenseBadge = current.tense ? `<span class="tense-badge">${current.tense}</span>` : '';
    area.innerHTML = `
        <div class="quiz-card">
            ${progressBarHtml()}
            <div class="quiz-prompt">
                ${promptText(current)}
                <button id="tts-btn" class="io-btn" title="Hear it in Swedish" aria-label="Hear it in Swedish" hidden>🔊</button>
            </div>
            <div class="quiz-context">${tenseBadge}</div>
            <div class="answer-row">
                <input type="text" id="answer-input" class="quiz-input" autocomplete="off" placeholder="Type your answer">
                <button id="mic-btn" class="io-btn" title="Speak your answer" aria-label="Speak your answer" hidden>🎤</button>
            </div>
            <div class="quiz-feedback" id="feedback"></div>
            <div class="quiz-buttons">
                <button id="submit-btn">Check</button>
            </div>
            <div class="quiz-stats">
                <div>Answered: <b id="stat-answered">${sessionAnswered}</b></div>
                <div>Correct: <b id="stat-correct">${sessionCorrect}</b></div>
            </div>
        </div>
    `;
    document.getElementById('submit-btn').addEventListener('click', onSubmitOrNext);
    const input = document.getElementById('answer-input');
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); onSubmitOrNext(); }
    });
    // any manual typing means this is no longer a voice answer -> strict grading
    input.addEventListener('input', () => { answerViaVoice = false; voiceAlternatives = []; });
    setupTts();
    setupMic();
    input.focus();
}

// ---------- text-to-speech: hear the Swedish word ----------
function swedishVoice() {
    const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.find(v => /sv(-|_)?se/i.test(v.lang) || /sv/i.test(v.lang));
}
function setupTts() {
    const btn = document.getElementById('tts-btn');
    if (!btn || !window.speechSynthesis) return;
    // don't give the Swedish answer away before it's been attempted
    const wouldSpoil = direction === 'sv' && !answered;
    btn.hidden = false;
    btn.disabled = wouldSpoil;
    btn.title = wouldSpoil ? 'Available after you answer' : 'Hear it in Swedish';
    btn.onclick = () => {
        const u = new SpeechSynthesisUtterance(current.swedish);
        u.lang = 'sv-SE';
        const v = swedishVoice();
        if (v) u.voice = v;
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
    };
}
// voice list can load async in some browsers
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { if (current) setupTts(); };

// ---------- speech-to-text: say your answer ----------
const MIC_ERRORS = {
    'not-allowed': 'Microphone blocked — allow mic access for this site in the address bar.',
    'service-not-allowed': 'This browser has no speech-recognition service. It works in Google Chrome; Chromium / Brave / Firefox on Linux usually don’t ship one.',
    'network': 'Speech service unreachable — it needs internet, and some Chromium builds have no speech backend at all.',
    'audio-capture': 'No microphone found.',
    'no-speech': 'Didn’t catch anything — try again and speak right after clicking.',
    'aborted': '',
};
function micNote(text, bad) {
    const fb = document.getElementById('feedback');
    if (!fb) return;
    fb.textContent = text;
    fb.className = 'quiz-feedback' + (bad ? ' incorrect' : '');
}
function setupMic() {
    const btn = document.getElementById('mic-btn');
    if (!btn || !SpeechRec) return;                 // Firefox / older Safari: stays typing-only
    btn.hidden = false;
    btn.onclick = () => {
        if (recognizing || answered) return;
        const rec = new SpeechRec();
        rec.lang = direction === 'sv' ? 'sv-SE' : 'en-US';   // language of the ANSWER
        rec.maxAlternatives = 6;
        rec.interimResults = false;
        recognizing = true;
        let sawError = false, gotResult = false;
        btn.classList.add('listening');
        const input = document.getElementById('answer-input');
        input.placeholder = 'Listening…';
        micNote('');
        rec.onresult = (e) => {
            gotResult = true;
            const alts = [...e.results[0]].map(r => (r.transcript || '').trim()).filter(Boolean);
            if (alts.length) {
                input.value = alts[0];               // programmatic set -> no 'input' event
                answerViaVoice = true;
                voiceAlternatives = alts;
                micNote('');
            }
        };
        rec.onerror = (e) => {
            sawError = true;
            const msg = MIC_ERRORS[e.error] !== undefined ? MIC_ERRORS[e.error]
                                                          : ('Speech recognition error: ' + e.error);
            if (msg) micNote('🎤 ' + msg, true);
        };
        rec.onend = () => {
            recognizing = false;
            btn.classList.remove('listening');
            input.placeholder = 'Type your answer';
            if (!gotResult && !sawError) micNote('🎤 Didn’t catch that — try again.', true);
            if (!recognizing) input.focus();
        };
        try {
            rec.start();
        } catch (err) {
            recognizing = false;
            btn.classList.remove('listening');
            input.placeholder = 'Type your answer';
            micNote('🎤 Could not start the microphone: ' + err.message, true);
        }
    };
}

let advancing = false;

async function onSubmitOrNext() {
    if (advancing) return;
    if (!answered) {
        const input = document.getElementById('answer-input');
        const given = input.value;
        answered = true;
        input.readOnly = true;

        const endpoint = retrying
            ? `/api/lessons/${lessonId}/quiz-typo-retry`
            : `/api/lessons/${lessonId}/quiz-check`;
        const res = await fetch(endpoint, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                word_id: current.id, answer: given, direction,
                voice: answerViaVoice, alternatives: voiceAlternatives,
            })
        });
        const result = await res.json();
        const correct = result.correct;

        if (!retrying) sessionAnswered++;
        if (correct) sessionCorrect++;

        input.classList.add(correct ? 'correct' : 'incorrect');
        input.focus();
        const fb = document.getElementById('feedback');
        fb.className = 'quiz-feedback ' + (correct ? 'correct' : 'incorrect');
        if (correct) {
            let base = retrying ? 'Correct! Counted as correct on the first try.' : 'Correct!';
            if (result.lenient) base += ` (heard “${result.heard}” — close enough)`;
            fb.textContent = base;
        } else {
            fb.textContent = retrying
                ? `Still incorrect — answer: ${result.correct_answer}`
                : `Incorrect — answer: ${result.correct_answer}`;
        }
        setupTts();   // the Swedish word is safe to hear now
        document.getElementById('submit-btn').textContent = 'Next';
        document.getElementById('stat-answered').textContent = sessionAnswered;
        document.getElementById('stat-correct').textContent = sessionCorrect;

        const existingTypoBtn = document.getElementById('typo-btn');
        if (existingTypoBtn) existingTypoBtn.remove();

        if (correct) {
            advancing = true;
            setTimeout(loadNext, 400);
        } else if (!retrying) {
            // first wrong attempt only - offer one retry
            const typoBtn = document.createElement('button');
            typoBtn.className = 'secondary';
            typoBtn.id = 'typo-btn';
            typoBtn.textContent = 'It was a typo';
            typoBtn.title = "Type it again - if you get it right this counts as correct, otherwise it counts as wrong";
            typoBtn.addEventListener('click', onRetryTypo);
            document.querySelector('.quiz-buttons').appendChild(typoBtn);
        }
    } else {
        loadNext();
    }
}

function onRetryTypo() {
    retrying = true;
    answered = false;
    answerViaVoice = false;
    voiceAlternatives = [];

    const input = document.getElementById('answer-input');
    input.value = '';
    input.readOnly = false;
    input.classList.remove('correct', 'incorrect');
    input.focus();

    const fb = document.getElementById('feedback');
    fb.textContent = '';
    fb.className = 'quiz-feedback';

    document.getElementById('submit-btn').textContent = 'Check';
    document.getElementById('typo-btn').remove();
}

async function loadNext() {
    answered = false;
    retrying = false;
    advancing = false;
    answerViaVoice = false;
    voiceAlternatives = [];
    const res = await fetch(`/api/lessons/${lessonId}/quiz-next?mode=${quizMode}`);
    const data = await res.json();
    current = data.word;
    progress = {pending: data.pending, done: data.done, total: data.total, score: data.score};
    renderQuizArea();
}

loadNext();
</script>
</body>
</html>
